<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客管理 - Markdown 编辑器 v2.1</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#f5f5f5; color:#333; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
        .container { max-width:1400px; margin:0 auto; padding:20px; }
        .header { background:white; border:1px solid #e0e0e0; border-radius:8px; padding:16px 20px; margin-bottom:20px; display:flex; justify-content:space-between; align-items:center; }
        .header h1 { font-size:18px; font-weight:600; }
        .header-actions { display:flex; gap:10px; }
        .btn { padding:8px 14px; border:1px solid #ddd; background:white; color:#333; border-radius:4px; font-size:14px; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; transition:all 0.2s; }
        .btn:hover { background:#f5f5f5; }
        .btn-primary { background:#333; color:white; border-color:#333; }
        .btn-primary:hover { background:#222; }
        .btn-success { background:#16a34a; border-color:#16a34a; color:#fff; }
        .btn-success:hover { background:#15803d; }
        .btn-danger { background:#e74c3c; border-color:#e74c3c; color:#fff; }
        .btn-danger:hover { background:#c0392b; }
        .btn-small { padding:6px 10px; font-size:13px; }
        .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:15px; margin-bottom:20px; }
        .stat-card { background:white; border:1px solid #e0e0e0; border-radius:8px; padding:20px; text-align:center; }
        .stat-card h3 { color:#999; font-size:12px; margin-bottom:8px; text-transform:uppercase; font-weight:normal; }
        .stat-card .number { font-size:32px; font-weight:700; color:#333; }
        .main-content { background:white; border:1px solid #e0e0e0; border-radius:8px; padding:20px; }
        .toolbar { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
        .search-box { flex:1; min-width:200px; }
        .search-box input, .filter-group select { width:100%; padding:10px 12px; border:1px solid #ddd; border-radius:4px; background:white; color:#333; font-size:14px; }
        .filter-group { display:flex; gap:10px; flex-wrap:wrap; }
        .post-list { list-style:none; }
        .post-item { background:#fafafa; border:1px solid #e0e0e0; border-radius:8px; padding:16px; margin-bottom:15px; }
        .post-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; }
        .post-title { font-size:16px; font-weight:600; color:#333; margin-bottom:6px; }
        .post-meta { display:flex; gap:15px; font-size:13px; color:#999; margin-bottom:10px; }
        .post-summary { color:#666; line-height:1.6; margin-bottom:10px; font-size:14px; }
        .post-tags { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
        .tag { background:white; color:#666; padding:4px 10px; border-radius:4px; font-size:12px; border:1px solid #e0e0e0; }
        .post-actions { display:flex; gap:8px; flex-wrap:wrap; }
        .status-badge { display:inline-block; padding:4px 10px; border-radius:4px; font-size:12px; border:1px solid #e0e0e0; }
        .status-published { background:#d4edda; color:#155724; border-color:#c3e6cb; }
        .status-draft { background:#fff3cd; color:#856404; border-color:#ffeeba; }
        .pagination { display:flex; justify-content:center; gap:8px; margin-top:20px; }
        .pagination button { padding:8px 14px; border:1px solid #ddd; background:white; color:#333; border-radius:4px; cursor:pointer; font-size:14px; }
        .pagination button.active { background:#333; color:white; border-color:#333; }
        .pagination button:disabled { opacity:.5; cursor:not-allowed; }
        
        /* 编辑器增强样式 */
        .editor-container { display:none; }
        .editor-container.active { display:block; }
        .editor-layout { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:20px; }
        .editor-panel { background:#fafafa; border:1px solid #e0e0e0; border-radius:8px; padding:16px; }
        .editor-panel h3 { font-size:14px; color:#666; margin-bottom:12px; display:flex; align-items:center; justify-content:space-between; }
        .form-group { margin-bottom:16px; }
        .form-group label { display:block; margin-bottom:8px; color:#666; font-size:14px; font-weight:500; }
        .form-group input, .form-group select, .form-group textarea { width:100%; padding:10px 12px; border:1px solid #ddd; border-radius:4px; background:white; color:#333; font-size:14px; transition:border-color 0.2s; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline:none; border-color:#4A9EFF; }
        .form-group textarea { min-height:500px; font-family:'Consolas','Monaco','Courier New',monospace; line-height:1.6; resize:vertical; }
        
        /* Markdown工具栏 */
        .markdown-toolbar { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:8px; padding:8px; background:#f9f9f9; border:1px solid #e0e0e0; border-radius:4px; }
        .markdown-toolbar button { padding:6px 10px; border:1px solid #ddd; background:white; color:#666; border-radius:3px; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:4px; transition:all 0.2s; }
        .markdown-toolbar button:hover { background:#f5f5f5; color:#333; border-color:#ccc; }
        .markdown-toolbar .separator { width:1px; background:#e0e0e0; margin:0 4px; }
        
        /* 预览区域 */
        .preview-content { background:white; padding:20px; border:1px solid #e0e0e0; border-radius:4px; min-height:500px; max-height:700px; overflow-y:auto; }
        .preview-content h1 { font-size:28px; margin-bottom:16px; }
        .preview-content h2 { font-size:24px; margin:20px 0 12px; }
        .preview-content h3 { font-size:20px; margin:16px 0 10px; }
        .preview-content p { line-height:1.8; margin-bottom:12px; }
        .preview-content code { background:#f5f5f5; padding:2px 6px; border-radius:3px; font-family:monospace; }
        .preview-content pre { background:#2d2d2d; color:#f8f8f2; padding:16px; border-radius:4px; overflow-x:auto; margin:12px 0; }
        .preview-content pre code { background:transparent; padding:0; }
        .preview-content blockquote { border-left:4px solid #4A9EFF; padding-left:16px; color:#666; margin:12px 0; }
        .preview-content ul, .preview-content ol { padding-left:24px; margin-bottom:12px; }
        .preview-content li { margin-bottom:6px; }
        
        /* 字数统计 */
        .editor-stats { display:flex; gap:20px; padding:8px 0; color:#999; font-size:13px; }
        
        /* 快捷键提示 */
        .shortcuts-hint { background:#fff9e6; border:1px solid #ffe4a3; border-radius:4px; padding:10px; margin-bottom:12px; font-size:13px; color:#856404; }
        
        .form-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:20px; padding-top:20px; border-top:1px solid #e0e0e0; }
        .loading, .empty-state { text-align:center; padding: 24px; color: #999; }
        
        @media (max-width: 1200px){ 
            .editor-layout { grid-template-columns: 1fr; }
            .stats-grid{ grid-template-columns: repeat(2,1fr);} 
            .header{flex-direction:column; gap:8px; align-items:stretch;} 
            .toolbar{flex-direction:column;} 
            .post-header{flex-direction:column;} 
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>博客管理</h1>
            <div class="header-actions">
                <button class="btn btn-primary" onclick="showEditor()">写文章</button>
            </div>
        </div>

        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <h3>总文章数</h3>
                <div class="number" id="totalPosts">-</div>
            </div>
            <div class="stat-card">
                <h3>已发布</h3>
                <div class="number" id="publishedPosts">-</div>
            </div>
            <div class="stat-card">
                <h3>草稿</h3>
                <div class="number" id="draftPosts">-</div>
            </div>
            <div class="stat-card">
                <h3>总浏览量</h3>
                <div class="number" id="totalViews">-</div>
            </div>
        </div>

        <div class="main-content">
            <div id="listView">
                <div class="toolbar">
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="搜索文章标题...">
                    </div>
                    <div class="filter-group">
                        <select id="statusFilter">
                            <option value="">全部状态</option>
                            <option value="1">已发布</option>
                            <option value="0">草稿</option>
                        </select>
                        <select id="categoryFilter">
                            <option value="">全部分类</option>
                        </select>
                    </div>
                </div>

                <ul class="post-list" id="postList"></ul>

                <div class="pagination" id="pagination"></div>
            </div>

            <div class="editor-container" id="editorView">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                    <h2 id="editorTitle" style="margin:0;">写新文章</h2>
                    <div class="editor-stats" id="editorStats">
                        <span>字数: <strong id="wordCount">0</strong></span>
                        <span>字符: <strong id="charCount">0</strong></span>
                        <span>段落: <strong id="paraCount">0</strong></span>
                    </div>
                </div>
                
                <div class="shortcuts-hint">
                    💡 快捷键: <strong>Ctrl+S</strong> 保存草稿 | <strong>Ctrl+B</strong> 加粗 | <strong>Ctrl+I</strong> 斜体 | <strong>Ctrl+K</strong> 插入链接 | <strong>Tab</strong> 缩进
                </div>
                
                <form id="postForm">
                    <input type="hidden" id="postId">
                    
                    <div class="form-group">
                        <label for="postTitle">标题 *</label>
                        <input type="text" id="postTitle" required placeholder="输入文章标题" autocomplete="off">
                    </div>

                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
                        <div class="form-group">
                            <label for="postSlug">URL别名 (留空自动生成)</label>
                            <input type="text" id="postSlug" placeholder="例如: my-first-post" autocomplete="off">
                        </div>

                        <div class="form-group">
                            <label for="postCategory">分类</label>
                            <select id="postCategory"></select>
                        </div>
                    </div>

                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
                        <div class="form-group">
                            <label for="postTags">标签 (逗号分隔)</label>
                            <input type="text" id="postTags" placeholder="例如: 技术, JavaScript, 教程" autocomplete="off">
                        </div>

                        <div class="form-group">
                            <label for="postCover">封面图片URL</label>
                            <input type="text" id="postCover" placeholder="https://example.com/image.jpg" autocomplete="off">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="postSummary">摘要 (选填,留空自动截取)</label>
                        <textarea id="postSummary" rows="2" placeholder="文章简介..." style="min-height:60px;"></textarea>
                    </div>

                    <div class="editor-layout">
                        <div class="editor-panel">
                            <h3>
                                Markdown编辑器
                                <button type="button" class="btn btn-small" onclick="togglePreview()" id="previewToggle">显示预览</button>
                            </h3>
                            
                            <!-- Markdown工具栏 -->
                            <div class="markdown-toolbar">
                                <button type="button" onclick="insertMarkdown('bold')" title="加粗 (Ctrl+B)"><strong>B</strong></button>
                                <button type="button" onclick="insertMarkdown('italic')" title="斜体 (Ctrl+I)"><em>I</em></button>
                                <button type="button" onclick="insertMarkdown('strikethrough')" title="删除线"><s>S</s></button>
                                <div class="separator"></div>
                                <button type="button" onclick="insertMarkdown('h1')" title="一级标题">H1</button>
                                <button type="button" onclick="insertMarkdown('h2')" title="二级标题">H2</button>
                                <button type="button" onclick="insertMarkdown('h3')" title="三级标题">H3</button>
                                <div class="separator"></div>
                                <button type="button" onclick="insertMarkdown('link')" title="链接 (Ctrl+K)">🔗</button>
                                <button type="button" onclick="insertMarkdown('image')" title="图片">🖼️</button>
                                <button type="button" onclick="insertMarkdown('code')" title="行内代码">`code`</button>
                                <button type="button" onclick="insertMarkdown('codeblock')" title="代码块">```</button>
                                <div class="separator"></div>
                                <button type="button" onclick="insertMarkdown('ul')" title="无序列表">• 列表</button>
                                <button type="button" onclick="insertMarkdown('ol')" title="有序列表">1. 列表</button>
                                <button type="button" onclick="insertMarkdown('quote')" title="引用">❝ 引用</button>
                                <button type="button" onclick="insertMarkdown('hr')" title="分割线">━━</button>
                                <div class="separator"></div>
                                <button type="button" onclick="insertMarkdown('table')" title="表格">📊</button>
                            </div>
                            
                            <div class="form-group" style="margin-bottom:0;">
                                <textarea id="postContent" required placeholder="# 开始写作...&#10;&#10;在这里输入你的文章内容,支持完整的Markdown语法。"></textarea>
                            </div>
                        </div>
                        
                        <div class="editor-panel" id="previewPanel" style="display:none;">
                            <h3>实时预览</h3>
                            <div class="preview-content" id="previewContent">
                                <p style="color:#999;text-align:center;padding:40px 0;">预览内容将显示在这里...</p>
                            </div>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn" onclick="cancelEdit()">取消</button>
                        <button type="button" class="btn" onclick="savePost(0)">保存草稿</button>
                        <button type="button" class="btn btn-success" onclick="savePost(1)">发布文章</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        let currentPage = 1;
        let totalPages = 1;
        let currentFilter = { status: '', category: '' };
        let categories = [];
        let previewVisible = false;
        let autoSaveTimer = null;

        // 页面加载时初始化
        window.addEventListener('DOMContentLoaded', async () => {
            // 确保有 admin token (从父窗口或本地存储获取)
            if (!localStorage.getItem('admin_token')) {
                // 尝试从父窗口获取(如果在iframe中)
                try {
                    if (window.parent && window.parent !== window) {
                        const parentToken = window.parent.localStorage.getItem('admin_token');
                        if (parentToken) {
                            localStorage.setItem('admin_token', parentToken);
                        }
                    }
                } catch (e) {
                    console.log('无法访问父窗口localStorage');
                }
            }

            if (!localStorage.getItem('admin_token')) {
                location.href = '/admin';
                return;
            }
            
            // 并行加载关键数据
            await Promise.all([
                loadCategories(),
                loadStats(),
                loadPosts()
            ]);
            
            // 延迟初始化编辑器功能 (非关键)
            requestIdleCallback(() => {
                initEditorFeatures();
            }, { timeout: 2000 });
        });
        
        // 初始化编辑器功能
        function initEditorFeatures() {
            const contentArea = document.getElementById('postContent');
            
            // 实时字数统计
            contentArea.addEventListener('input', function() {
                updateWordCount();
                updatePreview();
                
                // 自动保存草稿
                clearTimeout(autoSaveTimer);
                autoSaveTimer = setTimeout(() => {
                    if (document.getElementById('postId').value) {
                        autoSaveDraft();
                    }
                }, 3000);
            });
            
            // 快捷键支持
            contentArea.addEventListener('keydown', function(e) {
                // Ctrl+S 保存
                if (e.ctrlKey && e.key === 's') {
                    e.preventDefault();
                    savePost(0);
                }
                // Ctrl+B 加粗
                else if (e.ctrlKey && e.key === 'b') {
                    e.preventDefault();
                    insertMarkdown('bold');
                }
                // Ctrl+I 斜体
                else if (e.ctrlKey && e.key === 'i') {
                    e.preventDefault();
                    insertMarkdown('italic');
                }
                // Ctrl+K 链接
                else if (e.ctrlKey && e.key === 'k') {
                    e.preventDefault();
                    insertMarkdown('link');
                }
                // Tab 缩进
                else if (e.key === 'Tab') {
                    e.preventDefault();
                    insertAtCursor('    ');
                }
            });
        }
        
        // 更新字数统计
        function updateWordCount() {
            const content = document.getElementById('postContent').value;
            const chars = content.length;
            const words = content.trim() ? content.trim().split(/\s+/).length : 0;
            const paras = content.trim() ? content.split(/\n\n+/).filter(p => p.trim()).length : 0;
            
            document.getElementById('charCount').textContent = chars;
            document.getElementById('wordCount').textContent = words;
            document.getElementById('paraCount').textContent = paras;
        }
        
        // 切换预览
        function togglePreview() {
            const panel = document.getElementById('previewPanel');
            const toggle = document.getElementById('previewToggle');
            previewVisible = !previewVisible;
            
            if (previewVisible) {
                panel.style.display = 'block';
                toggle.textContent = '隐藏预览';
                updatePreview();
            } else {
                panel.style.display = 'none';
                toggle.textContent = '显示预览';
            }
        }
        
        // 更新预览内容
        function updatePreview() {
            if (!previewVisible) return;
            
            const content = document.getElementById('postContent').value;
            const preview = document.getElementById('previewContent');
            
            // 简单的Markdown转HTML (基础实现)
            let html = content
                // 标题
                .replace(/^### (.*$)/gim, '<h3>$1</h3>')
                .replace(/^## (.*$)/gim, '<h2>$1</h2>')
                .replace(/^# (.*$)/gim, '<h1>$1</h1>')
                // 加粗
                .replace(/\*\*(.*?)\*\*/gim, '<strong>$1</strong>')
                // 斜体
                .replace(/\*(.*?)\*/gim, '<em>$1</em>')
                // 删除线
                .replace(/~~(.*?)~~/gim, '<del>$1</del>')
                // 行内代码
                .replace(/`([^`]+)`/gim, '<code>$1</code>')
                // 链接
                .replace(/\[([^\]]+)\]\(([^)]+)\)/gim, '<a href="$2" target="_blank">$1</a>')
                // 图片
                .replace(/!\[([^\]]*)\]\(([^)]+)\)/gim, '<img src="$2" alt="$1" style="max-width:100%;border-radius:4px;"/>')
                // 引用
                .replace(/^> (.*$)/gim, '<blockquote>$1</blockquote>')
                // 无序列表
                .replace(/^\* (.*$)/gim, '<li>$1</li>')
                .replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>')
                // 有序列表
                .replace(/^\d+\. (.*$)/gim, '<li>$1</li>')
                // 分割线
                .replace(/^---$/gim, '<hr/>')
                // 段落
                .replace(/\n\n/g, '</p><p>')
                .replace(/^(.+)$/gim, '<p>$1</p>');
            
            preview.innerHTML = html || '<p style="color:#999;text-align:center;padding:40px 0;">预览内容将显示在这里...</p>';
        }
        
        // 插入Markdown语法
        function insertMarkdown(type) {
            const textarea = document.getElementById('postContent');
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const selectedText = textarea.value.substring(start, end);
            let replacement = '';
            let cursorOffset = 0;
            
            switch(type) {
                case 'bold':
                    replacement = `**${selectedText || '加粗文本'}**`;
                    cursorOffset = selectedText ? 0 : -2;
                    break;
                case 'italic':
                    replacement = `*${selectedText || '斜体文本'}*`;
                    cursorOffset = selectedText ? 0 : -1;
                    break;
                case 'strikethrough':
                    replacement = `~~${selectedText || '删除线文本'}~~`;
                    cursorOffset = selectedText ? 0 : -2;
                    break;
                case 'h1':
                    replacement = `# ${selectedText || '一级标题'}`;
                    cursorOffset = selectedText ? 0 : -5;
                    break;
                case 'h2':
                    replacement = `## ${selectedText || '二级标题'}`;
                    cursorOffset = selectedText ? 0 : -5;
                    break;
                case 'h3':
                    replacement = `### ${selectedText || '三级标题'}`;
                    cursorOffset = selectedText ? 0 : -5;
                    break;
                case 'link':
                    replacement = `[${selectedText || '链接文字'}](https://example.com)`;
                    cursorOffset = selectedText ? -22 : -24;
                    break;
                case 'image':
                    replacement = `![${selectedText || '图片描述'}](https://example.com/image.jpg)`;
                    cursorOffset = selectedText ? -32 : -34;
                    break;
                case 'code':
                    replacement = `\`${selectedText || '代码'}\``;
                    cursorOffset = selectedText ? 0 : -1;
                    break;
                case 'codeblock':
                    replacement = `\`\`\`\n${selectedText || '代码块'}\n\`\`\``;
                    cursorOffset = selectedText ? 0 : -4;
                    break;
                case 'ul':
                    replacement = `- ${selectedText || '列表项'}`;
                    cursorOffset = selectedText ? 0 : -4;
                    break;
                case 'ol':
                    replacement = `1. ${selectedText || '列表项'}`;
                    cursorOffset = selectedText ? 0 : -4;
                    break;
                case 'quote':
                    replacement = `> ${selectedText || '引用文字'}`;
                    cursorOffset = selectedText ? 0 : -5;
                    break;
                case 'hr':
                    replacement = '\n---\n';
                    cursorOffset = 0;
                    break;
                case 'table':
                    replacement = '\n| 列1 | 列2 | 列3 |\n|-----|-----|-----|\n| 内容 | 内容 | 内容 |\n';
                    cursorOffset = 0;
                    break;
            }
            
            textarea.value = textarea.value.substring(0, start) + replacement + textarea.value.substring(end);
            textarea.focus();
            
            const newPos = start + replacement.length + cursorOffset;
            textarea.setSelectionRange(newPos, newPos);
            
            updateWordCount();
            updatePreview();
        }
        
        // 在光标位置插入文本
        function insertAtCursor(text) {
            const textarea = document.getElementById('postContent');
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            
            textarea.value = textarea.value.substring(0, start) + text + textarea.value.substring(end);
            textarea.focus();
            textarea.setSelectionRange(start + text.length, start + text.length);
        }
        
        // 自动保存草稿
        async function autoSaveDraft() {
            const postId = document.getElementById('postId').value;
            if (!postId) return;
            
            console.log('自动保存草稿...');
            await savePost(0, true);
        }

        // 加载统计数据
        async function loadStats() {
            try {
                const response = await fetch('/blog/api?action=stats', {
                    headers: { 'Authorization': 'Bearer ' + localStorage.getItem('admin_token') }
                });
                const result = await response.json();

                if (result.success) {
                    document.getElementById('totalPosts').textContent = result.data.total;
                    document.getElementById('publishedPosts').textContent = result.data.published;
                    document.getElementById('draftPosts').textContent = result.data.draft;
                    document.getElementById('totalViews').textContent = result.data.total_views;
                }
            } catch (error) {
                console.error('加载统计数据失败:', error);
            }
        }

        // 加载分类列表
        async function loadCategories() {
            try {
                const response = await fetch('/blog/api?action=categories');
                const result = await response.json();

                if (result.success) {
                    categories = result.data;
                    
                    // 填充分类过滤器
                    const categoryFilter = document.getElementById('categoryFilter');
                    categoryFilter.innerHTML = '<option value="">全部分类</option>';
                    categories.forEach(cat => {
                        categoryFilter.innerHTML += `<option value="${cat.slug}">${cat.name} (${cat.post_count})</option>`;
                    });

                    // 填充编辑器中的分类选择
                    const postCategory = document.getElementById('postCategory');
                    postCategory.innerHTML = '<option value="">选择分类</option>';
                    categories.forEach(cat => {
                        postCategory.innerHTML += `<option value="${cat.slug}">${cat.name}</option>`;
                    });
                }
            } catch (error) {
                console.error('加载分类失败:', error);
            }
        }

        // 加载文章列表
        async function loadPosts(page = 1) {
            currentPage = page;
            const postList = document.getElementById('postList');
            postList.innerHTML = '<div class="loading">加载中...</div>';

            try {
                let url = `/blog/api?action=list&page=${page}&limit=20&status=${currentFilter.status || 'all'}`;
                if (currentFilter.category) url += `&category=${currentFilter.category}`;

                const response = await fetch(url, {
                    headers: { 'Authorization': 'Bearer ' + localStorage.getItem('admin_token') }
                });
                const result = await response.json();

                if (result.success) {
                    const posts = result.data.posts;
                    totalPages = result.data.pagination.pages;

                    if (posts.length === 0) {
                        postList.innerHTML = `
                            <div class="empty-state">
                                <svg fill="currentColor" viewBox="0 0 20 20"><path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"/><path fill-rule="evenodd" d="M4 5a2 2 0 012-2 3 3 0 003 3h2a3 3 0 003-3 2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm3 4a1 1 0 000 2h.01a1 1 0 100-2H7zm3 0a1 1 0 000 2h3a1 1 0 100-2h-3zm-3 4a1 1 0 100 2h.01a1 1 0 100-2H7zm3 0a1 1 0 100 2h3a1 1 0 100-2h-3z" clip-rule="evenodd"/></svg>
                                <h3>暂无文章</h3>
                                <p>点击"写文章"按钮开始创作吧！</p>
                            </div>
                        `;
                    } else {
                        postList.innerHTML = posts.map(post => renderPostItem(post)).join('');
                    }

                    renderPagination();
                }
            } catch (error) {
                console.error('加载文章失败:', error);
                postList.innerHTML = '<div class="empty-state"><p>加载失败，请刷新重试</p></div>';
            }
        }

        // 渲染文章项
        function renderPostItem(post) {
            // status 是 enum: 'draft' 或 'published'
            const statusClass = post.status === 'published' ? 'status-published' : 'status-draft';
            const statusText = post.status === 'published' ? '已发布' : '草稿';
            
            // tags 字段暂时不存在
            const tags = '';

            const publishInfo = post.status === 'published'
                ? `发布于 ${new Date(post.created_at).toLocaleDateString()}`
                : `创建于 ${new Date(post.created_at).toLocaleDateString()}`;

            return `
                <li class="post-item" data-id="${post.id}">
                    <div class="post-header">
                        <div>
                            <div class="post-title">${escapeHtml(post.title)}</div>
                            <div class="post-meta">
                                <span class="status-badge ${statusClass}">${statusText}</span>
                                <span>${post.author || '未知作者'}</span>
                                <span>浏览 ${post.view_count || 0}</span>
                                <span>${publishInfo}</span>
                            </div>
                        </div>
                    </div>
                    ${post.summary ? `<div class="post-summary">${escapeHtml(post.summary)}</div>` : ''}
                    ${tags ? `<div class="post-tags">${tags}</div>` : ''}
                    <div class="post-actions">
                        ${post.status === 'published' ? `<a href="/blog/article/${post.slug}" target="_blank" class="btn btn-small btn-secondary">查看</a>` : ''}
                        <button class="btn btn-small btn-primary" onclick="editPost('${post.id}')">编辑</button>
                        <button class="btn btn-small btn-danger" onclick="deletePost('${post.id}', '${escapeHtml(post.title)}')">删除</button>
                    </div>
                </li>
            `;
        }

        // 渲染分页
        function renderPagination() {
            const pagination = document.getElementById('pagination');
            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            let html = '';
            
            // 上一页
            html += `<button ${currentPage === 1 ? 'disabled' : ''} onclick="loadPosts(${currentPage - 1})">上一页</button>`;
            
            // 页码
            for (let i = 1; i <= Math.min(totalPages, 10); i++) {
                html += `<button class="${i === currentPage ? 'active' : ''}" onclick="loadPosts(${i})">${i}</button>`;
            }
            
            if (totalPages > 10) {
                html += `<button disabled>...</button>`;
            }
            
            // 下一页
            html += `<button ${currentPage === totalPages ? 'disabled' : ''} onclick="loadPosts(${currentPage + 1})">下一页</button>`;
            
            pagination.innerHTML = html;
        }

        // 显示编辑器
        function showEditor(postId = null) {
            document.getElementById('listView').style.display = 'none';
            document.getElementById('editorView').classList.add('active');
            
            if (postId) {
                document.getElementById('editorTitle').textContent = '编辑文章';
                loadPostData(postId);
            } else {
                document.getElementById('editorTitle').textContent = '写新文章';
                document.getElementById('postForm').reset();
                document.getElementById('postId').value = '';
            }
        }

        // 取消编辑
        function cancelEdit() {
            document.getElementById('listView').style.display = 'block';
            document.getElementById('editorView').classList.remove('active');
            document.getElementById('postForm').reset();
        }

        // 加载文章数据
        async function loadPostData(id) {
            try {
                const response = await fetch(`/blog/api?action=detail&id=${id}`, {
                    headers: { 'Authorization': 'Bearer ' + localStorage.getItem('admin_token') }
                });
                const result = await response.json();

                if (result.success) {
                    const post = result.data;
                    document.getElementById('postId').value = post.id;
                    document.getElementById('postTitle').value = post.title;
                    document.getElementById('postSlug').value = post.slug;
                    // category 和 tags 字段暂不存在
                    document.getElementById('postCategory').value = '';
                    document.getElementById('postTags').value = '';
                    document.getElementById('postCover').value = post.cover_image || '';
                    document.getElementById('postSummary').value = post.summary || '';
                    document.getElementById('postContent').value = post.content;
                }
            } catch (error) {
                console.error('加载文章数据失败:', error);
                alert('加载文章失败');
            }
        }

        // 编辑文章
        function editPost(id) {
            showEditor(id);
        }

        // 保存文章
        async function savePost(status, isAutoSave = false) {
            const id = document.getElementById('postId').value;
            const title = document.getElementById('postTitle').value.trim();
            const content = document.getElementById('postContent').value.trim();

            if (!title || !content) {
                if (!isAutoSave) {
                    alert('标题和内容不能为空');
                }
                return;
            }

            const data = {
                title,
                slug: document.getElementById('postSlug').value.trim(),
                category: document.getElementById('postCategory').value,
                tags: document.getElementById('postTags').value.trim(),
                cover_image: document.getElementById('postCover').value.trim(),
                summary: document.getElementById('postSummary').value.trim(),
                content,
                status
            };

            try {
                let url, method;
                if (id) {
                    url = '/blog/api?action=update';
                    method = 'PUT';
                    data.id = id;
                } else {
                    url = '/blog/api?action=create';
                    method = 'POST';
                }

                const response = await fetch(url, {
                    method,
                    credentials: 'same-origin',  // 发送 cookies/session
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + localStorage.getItem('admin_token')
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.success) {
                    if (!isAutoSave) {
                        alert(status == 1 ? '文章发布成功！' : '草稿保存成功！');
                        cancelEdit();
                        await loadStats();
                        await loadPosts(currentPage);
                    } else {
                        // 自动保存时静默处理
                        if (!id && result.data && result.data.id) {
                            document.getElementById('postId').value = result.data.id;
                        }
                    }
                } else {
                    if (!isAutoSave) {
                        alert('保存失败: ' + result.message);
                    }
                }
            } catch (error) {
                console.error('保存文章失败:', error);
                if (!isAutoSave) {
                    alert('保存失败，请重试');
                }
            }
        }

        // 删除文章
        async function deletePost(id, title) {
            if (!confirm(`确定要删除文章"${title}"吗？此操作不可恢复！`)) {
                return;
            }

            try {
                const response = await fetch('/blog/api?action=delete', {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + localStorage.getItem('admin_token')
                    },
                    body: JSON.stringify({ id })
                });

                const result = await response.json();

                if (result.success) {
                    alert('文章删除成功');
                    await loadStats();
                    await loadPosts(currentPage);
                } else {
                    alert('删除失败: ' + result.message);
                }
            } catch (error) {
                console.error('删除文章失败:', error);
                alert('删除失败，请重试');
            }
        }

        // 搜索过滤
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase();
            const items = document.querySelectorAll('.post-item');
            
            items.forEach(item => {
                const title = item.querySelector('.post-title').textContent.toLowerCase();
                item.style.display = title.includes(keyword) ? '' : 'none';
            });
        });

        // 状态过滤
        document.getElementById('statusFilter').addEventListener('change', (e) => {
            currentFilter.status = e.target.value;
            loadPosts(1);
        });

        // 分类过滤
        document.getElementById('categoryFilter').addEventListener('change', (e) => {
            currentFilter.category = e.target.value;
            loadPosts(1);
        });

        // HTML转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
