                    <h3 class="section-title reveal" data-reveal="up">留言板</h3>
                    <p class="section-desc reveal" data-reveal="up" style="--reveal-delay:.05s">留下你的足迹，分享你的想法</p>
                </div>

                <div class="guestbook-container">
                    <!-- 留言表单 -->
                    <div class="comment-form-wrapper">
                        <form id="comment-form" class="comment-form reveal" data-reveal="up" style="--reveal-delay:.1s" autocomplete="off">
                            <div class="form-group">
                                <label for="name">昵称 *</label>
                                <input 
                                    type="text" 
                                    name="name" 
                                    id="name" 
                                    placeholder="请输入你的昵称" 
                                    required 
                                    maxlength="32" 
                                    class="form-input"
                                />
                            </div>
                            <div class="form-group">
                                <label for="contact">联系方式</label>
                                <input 
                                    type="text" 
                                    name="contact" 
                                    id="contact" 
                                    placeholder="微信、QQ、邮箱等（选填）" 
                                    maxlength="64" 
                                    class="form-input"
                                />
                            </div>
                            <div class="form-group">
                                <label for="content">留言内容 *</label>
                                <textarea 
                                    name="content" 
                                    id="content" 
                                    placeholder="请让我听见你的声音... " 
                                    required 
                                    minlength="1" 
                                    maxlength="500"
                                    class="form-textarea"
                                    rows="4"
                                ></textarea>
                                <div class="char-count">
                                    <span id="char-current">0</span>/<span>500</span>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="captcha">验证码 *</label>
                                <div style="display:flex;gap:12px;align-items:center;">
                                    <input 
                                        type="text" 
                                        name="captcha" 
                                        id="captcha" 
                                        placeholder="请输入验证码" 
                                        required 
                                        maxlength="4" 
                                        class="form-input"
                                        style="flex:1;"
                                        autocomplete="off"
                                    />
                                    <img 
                                        id="captcha-img" 
                                        src="/captcha.php" 
                                        alt="验证码" 
                                        style="height:40px;border-radius:6px;cursor:pointer;border:1px solid var(--border);"
                                        onclick="this.src='/captcha.php?'+Date.now()"
                                        title="点击刷新"
                                    />
                                </div>
                            </div>
                            <div class="form-footer">
                                <label class="checkbox-label">
                                    <input type="checkbox" id="agree" required />
                                    <span>告诉阿蛋</span>
                                </label>
                                <button type="submit" class="btn btn-primary btn-submit">
                                    <span class="btn-text">发布留言</span>
                                    <span class="btn-loader" style="display:none">
                                        <svg class="spinner" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                            <circle cx="12" cy="12" r="10" stroke-width="4" opacity="0.25"></circle>
                                            <path d="M12 2a10 10 0 0 1 10 10" stroke-width="4" stroke-linecap="round"></path>
                                        </svg>
                                    </span>
                                </button>
                            </div>
                            <p class="form-tip" id="form-tip"></p>
                        </form>
                    </div>

                    <!-- 留言列表 -->
