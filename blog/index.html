    <style>
        .blog-wrapper {
            min-height: 100vh;
            background: var(--bg-primary);
            padding-top: 80px;
        }

        .blog-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px 80px;
        }

        .blog-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .blog-header h1 {
            font-size: 48px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 16px;
        }

        .blog-header p {
            font-size: 18px;
            color: var(--text-secondary);
        }

        .posts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
            margin-bottom: 60px;
        }

        .post-card {
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: all 0.3s;
            cursor: pointer;
            border: 1px solid var(--border);
        }

        .post-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }

        /* 封面容器，含渐变背景作为兜底 */
        .post-cover {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, var(--primary) 0%, #764ba2 100%);
        }

        /* 封面图片 */
        .post-cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .post-content {
            padding: 24px;
        }

        .post-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 12px;
            line-height: 1.4;
            display: -webkit-box;
            line-clamp: 2;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .post-summary {
            color: var(--text-secondary);
            line-height: 1.6;
            font-size: 14px;
            margin-bottom: 16px;
            display: -webkit-box;
            line-clamp: 3;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .post-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-muted);
            font-size: 13px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .post-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 40px 0;
        }

        .pagination button {
            padding: 10px 16px;
            border: 2px solid var(--primary);
            background: var(--bg-primary);
            color: var(--primary);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .pagination button:hover:not(:disabled) {
            background: var(--primary);
            color: white;
        }

        .pagination button.active {
            background: var(--primary);
            color: white;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loading-state {
            text-align: center;
            padding: 100px 20px;
            color: var(--text-secondary);
        }

        .loading-state svg {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 100px 20px;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .empty-state h3 {
            font-size: 24px;
            color: var(--text-primary);
            margin-bottom: 12px;
        }

        .empty-state p {
            color: var(--text-secondary);
        }

        @media (max-width: 768px) {
            .blog-header h1 {
                font-size: 36px;
            }

            .posts-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>

    <script>
        let currentPage = 1;
        let totalPages = 1;

        async function loadPosts(page = 1) {
            currentPage = page;
            document.getElementById('loadingState').style.display = 'block';
            document.getElementById('postsContainer').style.display = 'none';
            document.getElementById('emptyState').style.display = 'none';

            try {
                const res = await fetch(`/blog/api/?action=list&status=published&page=${page}&pageSize=12`);
                const data = await res.json();

                if (data.code === 200 && data.data) {
                    const posts = data.data.posts;
                    totalPages = data.data.totalPages;
                    document.getElementById('loadingState').style.display = 'none';

                    if (!posts || posts.length === 0) {
                        document.getElementById('emptyState').style.display = 'block';
                    } else {
                        renderPosts(posts);
                        renderPagination();
                    }
                } else {
                    throw new Error(data.message || '加载失败');
                }
            } catch (error) {
                console.error('加载文章失败:', error);
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('emptyState').style.display = 'block';
            }
        }

        function renderPosts(posts) {
            const container = document.getElementById('postsContainer');
            container.style.display = 'block';
            container.innerHTML = `<div class="posts-grid">${posts.map((post, i) => renderPostCard(post, i)).join('')}</div>`;
            
            // 为新加载的卡片添加reveal动画
            setTimeout(() => {
                const cards = container.querySelectorAll('.post-card');
                cards.forEach((card, idx) => {
                    card.classList.add('reveal');
                    card.setAttribute('data-reveal', 'up');
                    card.style.setProperty('--reveal-delay', `${idx * 0.05}s`);
                });
                // 触发reveal动画
                if (window.initReveal) window.initReveal();
            }, 50);
        }

        function renderPostCard(post, index) {
            const date = new Date(post.created_at).toLocaleDateString('zh-CN');
            const rawCover = (post.cover_image || '').trim();
            const isExternal = /^https?:\/\//i.test(rawCover) && !rawCover.startsWith(location.origin);
            const coverSrc = rawCover ? (isExternal ? `/image_proxy.php?url=${encodeURIComponent(rawCover)}` : rawCover) : '';
            const coverImage = coverSrc 
                ? `<div class="post-cover"><img src="${coverSrc}" alt="${escapeHtml(post.title)}" class="post-cover-img" referrerpolicy="no-referrer" loading="lazy" onerror="this.style.display='none'"></div>`
                : `<div class="post-cover"></div>`;

            return `
                <div class="post-card" onclick="location.href='/blog/article/${encodeURIComponent(post.slug)}'">
                    ${coverImage}
                    <div class="post-content">
                        <h2 class="post-title">${escapeHtml(post.title)}</h2>
                        ${post.summary ? `<p class="post-summary">${escapeHtml(post.summary)}</p>` : ''}
                        <div class="post-meta">
                            <span>
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <polyline points="12 6 12 12 16 14"></polyline>
                                </svg>
                                ${date}
                            </span>
                            <span>
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                ${post.view_count}
                            </span>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderPagination() {
            const pagination = document.getElementById('pagination');
            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            let html = `<button ${currentPage === 1 ? 'disabled' : ''} onclick="loadPosts(${currentPage - 1})">上一页</button>`;
            for (let i = 1; i <= Math.min(totalPages, 5); i++) {
                html += `<button class="${i === currentPage ? 'active' : ''}" onclick="loadPosts(${i})">${i}</button>`;
            }
            if (totalPages > 5) html += `<button disabled>...</button>`;
            html += `<button ${currentPage === totalPages ? 'disabled' : ''} onclick="loadPosts(${currentPage + 1})">下一页</button>`;
            pagination.innerHTML = html;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById('year').textContent = new Date().getFullYear();

        document.addEventListener('DOMContentLoaded', () => loadPosts(1));
    </script>
