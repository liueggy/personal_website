# Nginx配置 - 添加到你的网站配置文件中
# 位置通常是: /www/server/panel/vhost/nginx/liueggy.live.conf

server {
    listen 80;
    listen 443 ssl http2;
    server_name liueggy.live www.liueggy.live;
    
    root /www/wwwroot/liueggy.live;
    index index.html index.php;

    # SSL配置（如果已启用HTTPS）
    # ssl_certificate /path/to/cert.pem;
    # ssl_certificate_key /path/to/key.pem;

    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;

    # 博客路由
    location = /blog {
        rewrite ^/blog$ /blog/index.html last;
    }

    location /blog/ {
        try_files $uri $uri/ =404;
    }

    # 博客文章路由: /blog/article/slug
    location ~ ^/blog/article/([^/]+)/?$ {
        rewrite ^/blog/article/([^/]+)/?$ /blog/article.html?slug=$1 last;
    }

    # 管理后台路由
    location = /admin {
        rewrite ^/admin$ /admin/index.html last;
    }

    # PHP处理
    location ~ \.php$ {
        fastcgi_pass unix:/tmp/php-cgi-82.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # 静态资源缓存
    location ~* \.(css|js|jpg|jpeg|png|gif|svg|webp|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Service Worker不缓存
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
